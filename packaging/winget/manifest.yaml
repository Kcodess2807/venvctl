# winget manifest template for venvctl. The release workflow fills @VERSION@, @SHA_AMD64@ and
# @SHA_ARM64@ from dist\SHA256SUMS and attaches the result to the GitHub release.
# winget-pkgs wants the multi-file form (version / installer / defaultLocale): split it with
# `wingetcreate` (or by hand) when submitting the PR.
# yaml-language-server: $schema=https://aka.ms/winget-manifest.singleton.1.6.0.schema.json
PackageIdentifier: Kcodess2807.venvctl
PackageVersion: @VERSION@
PackageLocale: en-US
Publisher: Arush Karnatak
PackageName: venvctl
License: MIT
LicenseUrl: https://github.com/Kcodess2807/venvctl/blob/main/LICENSE
PackageUrl: https://github.com/Kcodess2807/venvctl
ShortDescription: Control your Python virtual environments on Windows
Description: >-
  Activate venvs the same way in PowerShell, CMD and Git Bash (no ExecutionPolicy errors),
  find and prune forgotten venvs, delete locked ones by stopping the processes that hold them,
  repair venvs after a folder move, and diagnose common Windows Python setup problems.
Moniker: venvctl
Tags:
  - python
  - venv
  - virtualenv
  - uv
  - powershell
ReleaseNotesUrl: https://github.com/Kcodess2807/venvctl/releases/tag/v@VERSION@
InstallationNotes: Run `venvctl init` once, then open a new terminal.
Installers:
  - Architecture: x64
    InstallerType: zip
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: venvctl.exe
        PortableCommandAlias: venvctl
    InstallerUrl: https://github.com/Kcodess2807/venvctl/releases/download/v@VERSION@/venvctl-@VERSION@-windows-amd64.zip
    InstallerSha256: @SHA_AMD64@
  - Architecture: arm64
    InstallerType: zip
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: venvctl.exe
        PortableCommandAlias: venvctl
    InstallerUrl: https://github.com/Kcodess2807/venvctl/releases/download/v@VERSION@/venvctl-@VERSION@-windows-arm64.zip
    InstallerSha256: @SHA_ARM64@
ManifestType: singleton
ManifestVersion: 1.6.0
