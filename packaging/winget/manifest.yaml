# DRAFT winget manifest for venvctl. Replace every <...> placeholder before submitting.
# winget-pkgs wants the multi-file form (version / installer / defaultLocale); split this with
# `wingetcreate` or by hand when publishing. Hashes come from dist\SHA256SUMS (upper-case them).
# yaml-language-server: $schema=https://aka.ms/winget-manifest.singleton.1.6.0.schema.json
PackageIdentifier: <Publisher>.venvctl
PackageVersion: <0.1.0>
PackageLocale: en-US
Publisher: <Publisher>
PackageName: venvctl
License: <MIT>
LicenseUrl: <https://github.com/OWNER/venvctl/blob/main/LICENSE>
PackageUrl: <https://github.com/OWNER/venvctl>
ShortDescription: Control your Python virtual environments on Windows
Description: >-
  Activate venvs the same way in PowerShell, CMD and Git Bash (no ExecutionPolicy errors),
  find and prune forgotten venvs, delete locked ones by stopping the processes that hold them,
  repair venvs after a folder move, and diagnose common Windows Python setup problems.
Moniker: venvctl
Tags:
  - python
  - venv
  - virtualenv
  - uv
  - powershell
ReleaseNotesUrl: <https://github.com/OWNER/venvctl/releases/tag/v0.1.0>
InstallationNotes: Run `venvctl init` once, then open a new terminal.
Installers:
  - Architecture: x64
    InstallerType: zip
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: venvctl.exe
        PortableCommandAlias: venvctl
    InstallerUrl: <https://github.com/OWNER/venvctl/releases/download/v0.1.0/venvctl-0.1.0-windows-amd64.zip>
    InstallerSha256: <SHA256 OF venvctl-0.1.0-windows-amd64.zip>
  - Architecture: arm64
    InstallerType: zip
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: venvctl.exe
        PortableCommandAlias: venvctl
    InstallerUrl: <https://github.com/OWNER/venvctl/releases/download/v0.1.0/venvctl-0.1.0-windows-arm64.zip>
    InstallerSha256: <SHA256 OF venvctl-0.1.0-windows-arm64.zip>
ManifestType: singleton
ManifestVersion: 1.6.0
