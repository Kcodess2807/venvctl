name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build.ps1 derives the version from git describe

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) { $files; throw "gofmt needed on the files above" }

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: install go-winres
        run: go install github.com/tc-hib/go-winres@latest

      - name: build amd64 + arm64 (unsigned)
        shell: pwsh
        run: ./build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: venvctl-windows
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
